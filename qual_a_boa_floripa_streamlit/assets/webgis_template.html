<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Qual a Boa Floripa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --deep:#0e3b4d;
  --deep-dark:#082530;
  --coral:#ff6a4d;
  --coral-dark:#e5563b;
  --surface:#fffdf9;
  --soft:#eef4f2;
  --sand:#f7ead6;
  --text:#152227;
  --muted:#5d7278;
  --border:#dce6e3;
  --shadow:0 8px 28px rgba(8,37,48,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body,#map{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:var(--deep-dark);
}
button,input{font:inherit}
#map{position:absolute;inset:0}
h1,h2,h3,.display{font-family:Fraunces,Georgia,serif}

/* Cabeçalho */
.topbar{
  position:absolute;
  z-index:1100;
  top:calc(10px + var(--safe-top));
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
  pointer-events:none;
}
.brand{
  pointer-events:auto;
  min-width:0;
  flex:1;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:16px;
  padding:9px 13px;
}
.brand strong{
  display:block;
  font-family:Fraunces,serif;
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--deep);
}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-size:11px;
}

/* Alternador Mapa / Calendário */
.view-switch{
  pointer-events:auto;
  display:flex;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:14px;
  padding:3px;
  gap:2px;
}
.view-btn{
  width:58px;height:100%;
  min-height:42px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:var(--deep);
  font-weight:600;
  font-size:11px;
  cursor:pointer;
}
.view-btn.active{background:var(--coral);color:#fff}

/* Ações rápidas */
.quick-actions{
  position:absolute;
  z-index:1060;
  right:10px;
  top:calc(78px + var(--safe-top));
  display:flex;
  flex-direction:column;
  gap:8px;
}
.fab{
  width:46px;height:46px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,253,249,.97);
  box-shadow:0 4px 16px rgba(8,37,48,.15);
  display:grid;place-items:center;
  font-size:18px;
  cursor:pointer;
  color:var(--deep);
}

/* Busca */
.search-box{
  position:absolute;
  z-index:1080;
  left:10px;
  right:66px;
  top:calc(77px + var(--safe-top));
  pointer-events:none;
}
.search-inner{
  pointer-events:auto;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:0 4px 18px rgba(8,37,48,.15);
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
}
.search-inner input{
  width:100%;
  border:0;
  outline:none;
  min-height:44px;
  font-size:15px;
  background:transparent;
  color:var(--text);
}
.search-inner span{color:var(--muted)}
.search-results{
  display:none;
  margin-top:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  max-height:240px;
  overflow-y:auto;
}
.search-results.open{display:block}
.search-item{
  width:100%;
  min-height:52px;
  border:0;
  background:var(--surface);
  text-align:left;
  padding:9px 12px;
  border-bottom:1px solid var(--soft);
  cursor:pointer;
}
.search-item:last-child{border-bottom:0}
.search-item b{display:block;font-size:13px}
.search-item span{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* Categorias */
.categories{
  position:absolute;
  z-index:1070;
  left:10px;
  right:10px;
  top:calc(130px + var(--safe-top));
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.categories::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  min-height:36px;
  padding:0 13px;
  border:1px solid var(--border);
  border-radius:999px;
  background:rgba(255,253,249,.96);
  color:var(--text);
  box-shadow:0 3px 12px rgba(8,37,48,.12);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.chip.active{
  background:var(--deep);
  color:#fff;
  border-color:var(--deep);
}

/* Bottom sheet (mapa) */
.sheet{
  position:absolute;
  z-index:1200;
  left:8px;right:8px;
  bottom:calc(8px + var(--safe-bottom));
  border-radius:19px;
  background:rgba(255,253,249,.99);
  border:1px solid var(--border);
  box-shadow:0 -5px 28px rgba(8,37,48,.2);
  overflow:hidden;
  max-height:60%;
}
.sheet.collapsed .sheet-body{display:none}
.sheet-handle{
  width:100%;
  border:0;background:transparent;
  padding:8px 12px 7px;
  cursor:pointer;
}
.sheet-handle:before{
  content:"";
  width:42px;height:4px;
  border-radius:99px;
  background:#d7c9b6;
  display:block;
  margin:0 auto 7px;
}
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.sheet-head div{min-width:0;text-align:left}
.sheet-head strong{
  display:block;font-family:Fraunces,serif;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.sheet-head span{
  display:block;font-size:11px;color:var(--muted);margin-top:2px
}
.sheet-body{
  border-top:1px solid var(--border);
  padding:12px;
  overflow:auto;
  max-height:440px;
}
.event-card{
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  margin-bottom:10px;
}
.event-card h3{font-size:15px;margin:0 0 4px;color:var(--deep)}
.event-card p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{
  padding:5px 9px;border-radius:999px;
  background:#fff;border:1px solid var(--border);
  font-size:11px
}
.badge.date{background:var(--sand);border-color:#ecd8b6;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.action{
  min-height:44px;border:0;border-radius:11px;
  background:var(--coral);color:#fff;font-weight:700;cursor:pointer;
}
.action.secondary{background:#e5efec;color:var(--deep)}
.list-item{
  display:grid;grid-template-columns:44px 1fr auto;gap:10px;
  align-items:center;min-height:62px;padding:8px 0;
  border-bottom:1px solid #ece3d5;cursor:pointer;
}
.list-item:last-child{border-bottom:0}
.list-icon{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;font-size:18px;
  background:#fff;border:1px solid var(--border);color:var(--deep)
}
.list-main{min-width:0}
.list-main b{display:block;font-size:13px}
.list-main span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.distance{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}

/* Calendário */
.cal-view{
  position:absolute;
  inset:0;
  z-index:900;
  background:var(--surface);
  display:none;
  overflow-y:auto;
  padding:calc(160px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
}
.cal-view.open{display:block}
.cal-day-group{margin-bottom:18px}
.cal-day-label{
  font-family:Fraunces,serif;
  font-size:14px;
  color:var(--deep);
  font-weight:700;
  margin:0 0 8px 2px;
}
.cal-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}
.cal-time{
  min-width:52px;
  font-weight:700;
  font-size:13px;
  color:var(--coral-dark);
  padding-top:1px;
}
.cal-main{min-width:0;flex:1}
.cal-main b{display:block;font-size:14px;color:var(--text)}
.cal-main span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}

.toast{
  position:absolute;z-index:1500;left:50%;
  top:calc(178px + var(--safe-top));
  transform:translateX(-50%) translateY(-6px);
  background:rgba(14,59,77,.94);color:#fff;
  padding:8px 12px;border-radius:999px;font-size:12px;
  opacity:0;transition:.2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Marcador */
.poi-marker{
  width:34px;height:34px;border-radius:50% 50% 50% 4px;
  background:var(--coral);border:3px solid #fff;
  box-shadow:0 3px 10px rgba(8,37,48,.35);
  display:grid;place-items:center;
  font-size:15px;color:#fff;
  transform:rotate(45deg);
}
.poi-marker span{transform:rotate(-45deg)}

.popup-photo{width:100%;border-radius:10px;margin-bottom:8px;display:block;max-height:130px;object-fit:cover}
.leaflet-popup-content-wrapper{border-radius:14px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <strong>Qual a Boa Floripa</strong>
    <span id="brandSubtitle">Carregando eventos…</span>
  </div>
  <div class="view-switch">
    <button class="view-btn active" id="btnViewMap" type="button">Mapa</button>
    <button class="view-btn" id="btnViewCal" type="button">Agenda</button>
  </div>
</div>

<div class="search-box">
  <div class="search-inner">
    <span>⌕</span>
    <input id="search" type="text" placeholder="Buscar evento ou lugar…" autocomplete="off">
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="categories" id="categories"></div>

<div class="quick-actions">
  <button class="fab" id="locateBtn" title="Minha localização">◎</button>
  <button class="fab" id="fitBtn" title="Ver toda Floripa">⤢</button>
</div>

<div id="map"></div>

<section class="sheet collapsed" id="sheet">
  <button class="sheet-handle" id="sheetHandle" type="button">
    <div class="sheet-head">
      <div>
        <strong id="sheetTitle">Eventos em Floripa</strong>
        <span id="sheetSubtitle"></span>
      </div>
      <span>⌃</span>
    </div>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="cal-view" id="calView"></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DADOS DE EVENTOS
   Este é o formato que a ferramenta de scraping + OCR/IA
   (posts do Instagram) deve gerar para alimentar o mapa.
   ========================================================= */
/* EVENTOS_INICIO — este bloco é substituído automaticamente por exportar_eventos.py */
let eventos = [];
/* EVENTOS_FIM */

const categoriasInfo = {
  feira:{nome:"Feira",icone:"🧺"},
  musica:{nome:"Música",icone:"♬"},
  cultura:{nome:"Cultura",icone:"◉"},
  gastronomia:{nome:"Gastronomia",icone:"☕"},
  esporte:{nome:"Esporte",icone:"⚡"}
};

/* =========================================================
   MAPA
   ========================================================= */
const map=L.map("map",{center:[-27.6050,-48.5100],zoom:12,zoomControl:false,preferCanvas:true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:20,attribution:"&copy; OpenStreetMap &copy; CARTO"
}).addTo(map);

let activeFilter="todos";
let userLatLng=null;
let userMarker=null;

function markerIcon(ev){
  const icone=categoriasInfo[ev.categoria]?.icone||"•";
  return L.divIcon({
    className:"",
    html:`<div class="poi-marker"><span>${icone}</span></div>`,
    iconSize:[34,34],iconAnchor:[17,30]
  });
}

function formatDataHora(ev){
  const [ay,am,ad]=ev.data_inicio.split("-");
  const dataFmt=`${ad}/${am}`;
  if(ev.data_inicio!==ev.data_fim){
    const [,,fd]=ev.data_fim.split("-");
    return `${dataFmt} a ${fd}/${am}`;
  }
  return `${dataFmt} • ${ev.hora_inicio}–${ev.hora_fim}`;
}

function popupContent(ev){
  return `<div style="min-width:200px;max-width:250px">
    ${ev.foto?`<img class="popup-photo" src="${ev.foto}" alt="${ev.nome}" loading="lazy" referrerpolicy="no-referrer">`:""}
    <b style="font-size:14px">${ev.nome}</b>
    <div style="font-size:11.5px;color:var(--coral-dark);font-weight:700;margin-top:4px">${formatDataHora(ev)}</div>
    <div style="font-size:12px;color:#5d7278;margin-top:5px">${ev.descricao}</div>
    <div style="font-size:11px;color:#5d7278;margin-top:6px"><b>Local:</b> ${ev.local}</div>
  </div>`;
}

const markers={};
function renderMarkers(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  eventos.forEach(ev=>{
    if(activeFilter!=="todos" && ev.categoria!==activeFilter)return;
    const m=L.marker([ev.lat,ev.lng],{icon:markerIcon(ev)}).addTo(map);
    m.bindPopup(popupContent(ev));
    m.on("click",()=>selectEvent(ev,m));
    markers[ev.id]=m;
  });
}
renderMarkers();

function categoryChips(){
  const cont=document.getElementById("categories");
  const cats=["todos",...Object.keys(categoriasInfo)];
  cont.innerHTML=cats.map(c=>{
    const label=c==="todos"?"Todos":categoriasInfo[c].nome;
    return `<button class="chip${c==="todos"?" active":""}" data-filter="${c}" type="button">${label}</button>`;
  }).join("");
  cont.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click",()=>{
      activeFilter=btn.dataset.filter;
      cont.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===btn));
      renderMarkers();
      renderList();
      renderCalendar();
    });
  });
}
categoryChips();

function distanceText(lat,lng){
  if(!userLatLng)return "";
  const m=userLatLng.distanceTo(L.latLng(lat,lng));
  return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1)} km`;
}

function selectEvent(ev,marker){
  document.getElementById("sheetTitle").textContent=ev.nome;
  document.getElementById("sheetSubtitle").textContent=formatDataHora(ev);
  document.getElementById("sheetBody").innerHTML=`
    <div class="event-card">
      ${ev.foto?`<img class="popup-photo" src="${ev.foto}" alt="${ev.nome}">`:""}
      <h3>${categoriasInfo[ev.categoria].icone} ${ev.nome}</h3>
      <p>${ev.descricao}</p>
      <div class="meta">
        <span class="badge date">${formatDataHora(ev)}</span>
        <span class="badge">${ev.local}</span>
        ${distanceText(ev.lat,ev.lng)?`<span class="badge">${distanceText(ev.lat,ev.lng)}</span>`:""}
      </div>
      <div class="actions">
        <button class="action secondary" id="openInsta" type="button">Ver no Instagram</button>
        <button class="action" id="openRoute" type="button">Como chegar</button>
      </div>
    </div>`;
  document.getElementById("openInsta").addEventListener("click",()=>window.open(ev.instagram_url,"_blank"));
  document.getElementById("openRoute").addEventListener("click",()=>{
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${ev.lat},${ev.lng}`,"_blank");
  });
  expandSheet();
  if(window.innerWidth<850)collapseSheetOnSelect();
}
function collapseSheetOnSelect(){ /* mantém aberto ao selecionar por toque no mapa */ }

function renderList(){
  const feats=eventos.filter(e=>activeFilter==="todos"||e.categoria===activeFilter);
  document.getElementById("sheetTitle").textContent=activeFilter==="todos"?"Eventos em Floripa":categoriasInfo[activeFilter].nome;
  document.getElementById("sheetSubtitle").textContent=`${feats.length} ${feats.length===1?"evento":"eventos"}`;
  document.getElementById("brandSubtitle").textContent=`${eventos.length} eventos nesta semana`;
  document.getElementById("sheetBody").innerHTML=feats.map(ev=>`
    <div class="list-item" data-id="${ev.id}">
      <div class="list-icon">${categoriasInfo[ev.categoria].icone}</div>
      <div class="list-main">
        <b>${ev.nome}</b>
        <span>${ev.local} • ${formatDataHora(ev)}</span>
      </div>
      <div class="distance">${distanceText(ev.lat,ev.lng)}</div>
    </div>`).join("");
  document.querySelectorAll(".list-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const ev=eventos.find(e=>e.id===Number(el.dataset.id));
      const marker=markers[ev.id];
      if(ev&&marker){
        map.setView(marker.getLatLng(),15);
        marker.openPopup();
        selectEvent(ev,marker);
      }
    });
  });
}
renderList();

/* =========================================================
   CALENDÁRIO / AGENDA
   ========================================================= */
function diaLabel(dataStr){
  const dias=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  const d=new Date(dataStr+"T00:00:00");
  const [,m,day]=dataStr.split("-");
  return `${dias[d.getDay()]} • ${day}/${m}`;
}

function renderCalendar(){
  const feats=eventos.filter(e=>activeFilter==="todos"||e.categoria===activeFilter)
    .slice().sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio)||a.hora_inicio.localeCompare(b.hora_inicio));
  const grupos={};
  feats.forEach(ev=>{
    (grupos[ev.data_inicio]=grupos[ev.data_inicio]||[]).push(ev);
  });
  const cal=document.getElementById("calView");
  cal.innerHTML=Object.keys(grupos).map(data=>`
    <div class="cal-day-group">
      <div class="cal-day-label">${diaLabel(data)}</div>
      ${grupos[data].map(ev=>`
        <div class="cal-item" data-id="${ev.id}">
          <div class="cal-time">${ev.hora_inicio}</div>
          <div class="cal-main">
            <b>${categoriasInfo[ev.categoria].icone} ${ev.nome}</b>
            <span>${ev.local} — ${ev.descricao}</span>
          </div>
        </div>`).join("")}
    </div>`).join("") || `<p style="color:var(--muted);text-align:center;margin-top:40px">Nenhum evento nesta categoria.</p>`;
  cal.querySelectorAll(".cal-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const ev=eventos.find(e=>e.id===Number(el.dataset.id));
      switchView("map");
      const marker=markers[ev.id];
      if(marker){
        map.setView(marker.getLatLng(),15);
        marker.openPopup();
        selectEvent(ev,marker);
      }
    });
  });
}
renderCalendar();

/* Alternador de vista */
function switchView(view){
  const calOpen=view==="cal";
  document.getElementById("calView").classList.toggle("open",calOpen);
  document.getElementById("btnViewMap").classList.toggle("active",!calOpen);
  document.getElementById("btnViewCal").classList.toggle("active",calOpen);
  document.getElementById("categories").style.display=calOpen?"none":"flex";
  document.getElementById("sheet").style.display=calOpen?"none":"block";
  if(!calOpen)setTimeout(()=>map.invalidateSize(),50);
}
document.getElementById("btnViewMap").addEventListener("click",()=>switchView("map"));
document.getElementById("btnViewCal").addEventListener("click",()=>switchView("cal"));

/* Busca */
const search=document.getElementById("search");
const results=document.getElementById("searchResults");
search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  results.innerHTML="";
  if(q.length<2){results.classList.remove("open");return;}
  const matches=eventos.filter(e=>(e.nome+e.local+e.descricao).toLowerCase().includes(q)).slice(0,8);
  matches.forEach(ev=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="search-item";
    b.innerHTML=`<b>${categoriasInfo[ev.categoria].icone} ${ev.nome}</b><span>${ev.local} • ${formatDataHora(ev)}</span>`;
    b.addEventListener("click",()=>{
      results.classList.remove("open");
      search.value=ev.nome;
      switchView("map");
      const marker=markers[ev.id];
      map.setView(marker.getLatLng(),15);
      marker.openPopup();
      selectEvent(ev,marker);
    });
    results.appendChild(b);
  });
  results.classList.toggle("open",matches.length>0);
});

/* Localização */
const locateBtn=document.getElementById("locateBtn");
locateBtn.addEventListener("click",()=>{
  if(!("geolocation" in navigator)){showToast("Geolocalização não suportada");return;}
  locateBtn.textContent="…";
  map.locate({setView:false,enableHighAccuracy:true,timeout:10000,maxZoom:15});
});
map.on("locationfound",e=>{
  locateBtn.textContent="◎";
  userLatLng=e.latlng;
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.circleMarker(e.latlng,{radius:7,color:"#1976d2",weight:2,fillColor:"#1976d2",fillOpacity:.5}).addTo(map);
  map.setView(e.latlng,14);
  showToast(`Localização encontrada • ±${Math.round(e.accuracy)} m`);
  renderList();
});
map.on("locationerror",()=>{
  locateBtn.textContent="◎";
  showToast("Não foi possível acessar sua localização");
});

/* Enquadrar tudo */
document.getElementById("fitBtn").addEventListener("click",()=>{
  const group=L.featureGroup(Object.values(markers));
  if(group.getLayers().length)map.fitBounds(group.getBounds().pad(.15));
  showToast("Ilha enquadrada");
});

/* Bottom sheet */
const sheet=document.getElementById("sheet");
function expandSheet(){sheet.classList.remove("collapsed")}
function collapseSheet(){if(window.innerWidth<850)sheet.classList.add("collapsed")}
document.getElementById("sheetHandle").addEventListener("click",()=>{
  if(window.innerWidth>=850)return;
  sheet.classList.toggle("collapsed");
});

/* Toast */
let toastTimer;
function showToast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

/* Inicial */
const groupInit=L.featureGroup(Object.values(markers));
if(groupInit.getLayers().length)map.fitBounds(groupInit.getBounds().pad(.2));
window.addEventListener("resize",()=>map.invalidateSize());
</script>
</body>
</html>
