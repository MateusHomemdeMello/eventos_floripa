function openEvent(id){const group=places.find(p=>p.events.some(e=>e.id===String(id)));if(group)openEventGroup(group.events,id);}
function updateCarousel(){const e=currentCarouselEvents[currentCarouselIndex];if(!e)return;const c=category(e.categoria),saved=favorites.has(e.id),count=currentCarouselEvents.length;const navigation=count>1?`<div class="carousel-nav"><button type="button" data-move="-1" aria-label="Evento anterior">‹</button><div class="dots">${currentCarouselEvents.map((_,i)=>`<button type="button" class="dot" data-slide="${i}" aria-label="Ir para evento ${i+1}" aria-pressed="${i===currentCarouselIndex}">●</button>`).join('')}</div><button type="button" data-move="1" aria-label="Próximo evento">›</button></div>`:'';
 $('detailContent').innerHTML=`${photo(e,true)}<div class="detail-body"><div class="eyebrow" id="carouselCount" aria-live="polite">${count>1?`${currentCarouselIndex+1} de ${count} neste local · `:''}${c.icone} ${c.nome}</div><h2 id="detailTitle">${escapeHTML(e.nome)}</h2><div class="detail-meta"><p>◷ <b>${escapeHTML(dateLabel(e))}</b><br>${escapeHTML(times(e))}</p><p>⌖ <b>${escapeHTML(e.local)}</b><br>${escapeHTML(e.endereco)}${e.bairro?'<br>'+escapeHTML(e.bairro):''}${distance(e)?'<br>'+distance(e)+' de você':''}</p></div>${e.descricao?`<p class="description">${escapeHTML(e.descricao)}</p>`:''}<div class="actions"><button type="button" class="save" data-favorite="${escapeHTML(e.id)}" aria-pressed="${saved}">${saved?'♥ Salvo':'♡ Quero ir'}</button>${hasCoordinates(e)?`<a href="https://www.google.com/maps/dir/?api=1&amp;destination=${e.lat},${e.lng}" target="_blank" rel="noopener noreferrer">🧭 Como chegar</a>`:''}<button type="button" id="share">↗ Compartilhar evento</button></div>${e.instagram_url?`<a class="original" href="${escapeHTML(e.instagram_url)}" target="_blank" rel="noopener noreferrer">Ver publicação original ↗</a>`:''}<div id="detailNotice" role="status"></div>${navigation}</div>`;
}
function moveCarousel(delta){const size=currentCarouselEvents.length;if(size<2)return;currentCarouselIndex=(currentCarouselIndex+delta+size)%size;updateCarousel();}
function toggleFavorite(id){id=String(id);favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('qbf-favorites-v1',JSON.stringify([...favorites]));}catch{notify('Salvo nesta sessão. O navegador bloqueou o armazenamento permanente.');}refresh();}
let noticeTimer;function notify(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,4500);}
async function shareEvent(){const e=currentCarouselEvents[currentCarouselIndex];if(!e)return;const text=`${e.nome}\n${dateLabel(e)} · ${times(e)}\n${e.local}${e.instagram_url?'\n'+e.instagram_url:''}`;if(navigator.share){try{await navigator.share({title:e.nome,text});return;}catch(error){if(error.name==='AbortError')return;}}try{await navigator.clipboard.writeText(text);$('detailNotice').textContent='Informações copiadas!';}catch{const field=document.createElement('textarea');field.value=text;field.setAttribute('aria-label','Texto para compartilhar');field.readOnly=true;$('detailNotice').replaceChildren('Copie o texto abaixo:',field);field.focus();field.select();}}
function switchView(view){const agenda=view==='agenda';$('agenda').hidden=!agenda;$('sheet').hidden=agenda;$('mapActions').hidden=agenda;$('mapTab').setAttribute('aria-pressed',String(!agenda));$('agendaTab').setAttribute('aria-pressed',String(agenda));if(!agenda&&map)requestAnimationFrame(()=>map.invalidateSize());}
$('categories').innerHTML='<button type="button" class="chip category-chip" data-category="todos" aria-pressed="true" style="--cat:#075c68">Todos</button>'+Object.entries(categories).map(([key,c])=>`<button type="button" class="chip category-chip" data-category="${key}" aria-pressed="false" style="--cat:${c.cor}"><span>${c.icone}</span> ${c.nome}</button>`).join('');
$('quickFilters').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.id==='favoriteFilter'){favoritesOnly=!favoritesOnly;button.setAttribute('aria-pressed',String(favoritesOnly));button.textContent=favoritesOnly?'♥ Quero ir':'♡ Quero ir';}else{activeQuick=button.dataset.quick;document.querySelectorAll('[data-quick]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.quick===activeQuick)));}refresh();});
$('categories').addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));refresh();});
let searchTimer;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,120);});
document.addEventListener('click',event=>{const favorite=event.target.closest('[data-favorite]'),open=event.target.closest('[data-open]'),move=event.target.closest('[data-move]'),slide=event.target.closest('[data-slide]');if(favorite)toggleFavorite(favorite.dataset.favorite);else if(open)openEvent(open.dataset.open);else if(move)moveCarousel(Number(move.dataset.move));else if(slide){currentCarouselIndex=Number(slide.dataset.slide);updateCarousel();}else if(event.target.closest('#share'))shareEvent();});
// The colored fallback is already behind each photo; failed URLs are removed.
document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement){event.target.style.opacity='1';const icon=event.target.parentElement.querySelector('span');if(icon)icon.style.visibility='hidden';}},true);
document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)event.target.remove();},true);
$('mapTab').onclick=()=>switchView('map');$('agendaTab').onclick=()=>switchView('agenda');$('closeDetail').onclick=()=>$('detail').close();
$('detail').addEventListener('click',event=>{if(event.target===$('detail')){const r=$('detail').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('detail').close();}});
document.addEventListener('keydown',event=>{if(!$('detail').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();moveCarousel(event.key==='ArrowLeft'?-1:1);}if(event.key==='Escape')$('detail').close();});
// Vertical movement cancels a swipe; normal detail scrolling stays native.
let swipeStart=null;$('detail').addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'||event.target.closest('button,a,input,textarea'))return;swipeStart={x:event.clientX,y:event.clientY};});
$('detail').addEventListener('pointercancel',()=>swipeStart=null);
$('detail').addEventListener('pointerup',event=>{if(!swipeStart)return;const dx=event.clientX-swipeStart.x,dy=event.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)moveCarousel(dx<0?1:-1);});
$('sheetToggle').onclick=()=>{const expanded=$('sheet').classList.toggle('expanded');$('sheetToggle').setAttribute('aria-expanded',String(expanded));};
$('random').onclick=()=>{if(!filtered.length)return;const e=filtered[Math.floor(Math.random()*filtered.length)];openEvent(e.id);};
$('fit').onclick=fitPlaces;
$('locate').onclick=()=>{if(!navigator.geolocation){notify('Localização indisponível neste navegador.');return;}navigator.geolocation.getCurrentPosition(position=>{userLatLng=[position.coords.latitude,position.coords.longitude];if(map){if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(userLatLng,{radius:8,color:'#fff',weight:3,fillColor:'#087780',fillOpacity:1}).addTo(map).bindTooltip('Você está aqui');map.setView(userLatLng,14);}refresh();notify('Localização encontrada. As distâncias estão nos eventos.');},()=>notify('Não foi possível obter sua localização. Continue explorando o mapa e a agenda.'),{timeout:12000,maximumAge:60000});};
new ResizeObserver(()=>document.documentElement.style.setProperty('--top-height',$('top').offsetHeight+'px')).observe($('top'));
initMap();refresh();if(map)requestAnimationFrame(fitPlaces);
</script>
</body>
</html>
