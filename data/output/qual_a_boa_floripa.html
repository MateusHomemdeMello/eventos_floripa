<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qual a Boa Floripa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --deep:#075c68;
  --deep-dark:#123e42;
  --coral:#b64e34;
  --coral-dark:#993c28;
  --surface:#fffaf0;
  --soft:#edf3ea;
  --sand:#f2dfb5;
  --text:#193d3c;
  --muted:#526c65;
  --border:#d5dfcf;
  --forest:#28745d;
  --shadow:0 8px 28px rgba(8,37,48,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body,#map{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Nunito,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:var(--deep-dark);
}
button,input{font:inherit}
#map{position:absolute;inset:0}
.basemap-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-bottom.leaflet-right{z-index:1250;bottom:var(--safe-bottom)}
.leaflet-control-attribution{
  max-width:100vw;margin:0!important;padding:4px 8px;
  background:var(--surface)!important;color:var(--text);font:11px/1.4 Nunito,Arial,sans-serif;
}
.leaflet-control-attribution a{color:var(--deep);text-decoration:underline}
button:focus-visible,select:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
h1,h2,h3,.display{font-family:Nunito,Arial,sans-serif;font-weight:800}

/* Cabeçalho */
.topbar{
  position:absolute;
  z-index:1100;
  top:calc(10px + var(--safe-top));
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
  pointer-events:none;
}
.brand{
  pointer-events:auto;
  min-width:0;
  flex:1;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:16px;
  padding:9px 13px;
}
.brand strong{
  display:block;
  font-family:Nunito,Arial,sans-serif;
  font-weight:800;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--deep);
}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-size:11px;
}

/* Alternador Mapa / Calendário */
.view-switch{
  pointer-events:auto;
  display:flex;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:14px;
  padding:3px;
  gap:2px;
}
.view-btn{
  width:58px;height:100%;
  min-height:42px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:var(--deep);
  font-weight:600;
  font-size:11px;
  cursor:pointer;
}
.view-btn.active{background:var(--deep);color:#fff}

/* Ações rápidas */
.quick-actions{
  position:absolute;
  z-index:1060;
  left:10px;right:10px;
  top:calc(178px + var(--safe-top));
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.brand .last-update{font-size:9px;opacity:.72;margin-top:0}
.quick-actions>*{pointer-events:auto}
.basemap-picker{
  display:flex;align-items:center;gap:8px;
  min-width:0;max-width:320px;flex:1;margin-right:auto;
  padding:0 12px;min-height:46px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  color:var(--deep);font-size:12px;font-weight:600;
}
.basemap-picker span{white-space:nowrap}
.basemap-picker select{
  min-width:0;width:100%;min-height:44px;font:inherit;
  border:0;background:transparent;color:var(--text);cursor:pointer;
}
@media(max-width:380px){.basemap-picker{padding:0 8px;gap:4px}.basemap-picker span{display:none}}
.fab{
  width:46px;height:46px;
  flex:0 0 46px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,253,249,.97);
  box-shadow:0 4px 16px rgba(8,37,48,.15);
  display:grid;place-items:center;
  font-size:18px;
  cursor:pointer;
  color:var(--deep);
}

/* Busca */
.search-box{
  position:absolute;
  z-index:1080;
  left:10px;
  right:10px;
  top:calc(77px + var(--safe-top));
  pointer-events:none;
}
.search-inner{
  pointer-events:auto;
  background:rgba(255,253,249,.97);
  border:1px solid var(--border);
  box-shadow:0 4px 18px rgba(8,37,48,.15);
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
}
.search-inner input{
  width:100%;
  border:0;
  outline:none;
  min-height:44px;
  font-size:15px;
  background:transparent;
  color:var(--text);
}
.search-inner span{color:var(--muted)}
.search-results{
  display:none;
  margin-top:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  max-height:240px;
  overflow-y:auto;
}
.search-results.open{display:block}
.search-item{
  width:100%;
  min-height:52px;
  border:0;
  background:var(--surface);
  text-align:left;
  padding:9px 12px;
  border-bottom:1px solid var(--soft);
  cursor:pointer;
}
.search-item:last-child{border-bottom:0}
.search-item b{display:block;font-size:13px}
.search-item span{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* Categorias */
.categories{
  position:absolute;
  z-index:1070;
  left:10px;
  right:66px;
  top:calc(130px + var(--safe-top));
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.categories::-webkit-scrollbar{display:none}
.filter-toggle{position:absolute;right:10px;top:calc(130px + var(--safe-top));z-index:1070;height:38px}
.filter-toggle.active{background:var(--deep);color:white}
.filter-dialog{width:min(440px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;border:1px solid var(--border);border-radius:20px;padding:22px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.filter-dialog::backdrop{background:rgba(18,62,66,.55)}
.filter-dialog h2{margin:0 0 16px;font-size:22px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filter-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.filter-preset{min-height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--deep);font-weight:700;cursor:pointer}
.filter-preset.active{background:var(--deep);border-color:var(--deep);color:#fff}
.advanced-filters{margin-top:12px}.advanced-filters summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--deep);padding:8px 0}.advanced-filters .filter-grid{margin-top:8px}
.filter-grid label{font-size:13px;font-weight:700;min-width:0}
.filter-grid input{width:100%;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:6px;background:white;color:var(--text)}
.filter-dialog p,.filter-check{font-size:13px;line-height:1.5}
.filter-check{display:flex;gap:8px;align-items:center;margin:14px 0}
.filter-error{color:var(--coral-dark)}
.filter-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.filter-buttons button{padding:0 14px;flex:1}
.chip{
  flex:0 0 auto;
  min-height:36px;
  padding:0 13px;
  border:1px solid var(--border);
  border-radius:999px;
  background:rgba(255,253,249,.96);
  color:var(--text);
  box-shadow:0 3px 12px rgba(8,37,48,.12);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.chip.active{
  background:var(--category-color,var(--deep));
  color:#fff;
  border-color:var(--category-color,var(--deep));
}

/* Bottom sheet (mapa) */
.sheet{
  position:absolute;
  z-index:1200;
  left:8px;right:8px;
  bottom:calc(8px + var(--safe-bottom) + var(--attribution-height,30px));
  border-radius:19px;
  background:rgba(255,253,249,.99);
  border:1px solid var(--border);
  box-shadow:0 -5px 28px rgba(8,37,48,.2);
  overflow:hidden;
  max-height:min(60%,calc(100% - 240px - var(--safe-top) - var(--safe-bottom) - var(--attribution-height,30px)));
}
.sheet.collapsed .sheet-body{display:none}
.sheet-close{
  position:absolute;right:8px;top:8px;width:44px;height:44px;
  border:1px solid var(--border);border-radius:12px;background:var(--soft);
  color:var(--deep);font-size:26px;line-height:1;cursor:pointer;
}
.sheet.collapsed .sheet-close{display:none}
.sheet:not(.collapsed) .sheet-handle{padding-right:62px}
.sheet-handle{
  width:100%;
  border:0;background:transparent;
  padding:8px 12px 7px;
  cursor:pointer;
}
.sheet-handle:before{display:none}
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.sheet-head div{min-width:0;text-align:left}
.sheet-head strong{
  display:block;font-family:Nunito,Arial,sans-serif;font-size:15px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.sheet-head span{
  display:block;font-size:11px;color:var(--muted);margin-top:2px
}
.sheet-body{
  border-top:1px solid var(--border);
  padding:12px;
  overflow:auto;
  max-height:min(440px,calc(100dvh - 320px - var(--safe-top) - var(--safe-bottom) - var(--attribution-height,30px)));
}
.event-card{
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
  margin-bottom:10px;
}
.event-card h3{font-size:15px;margin:0 0 4px;color:var(--deep)}
.event-card p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{
  padding:5px 9px;border-radius:999px;
  background:#fff;border:1px solid var(--border);
  font-size:11px
}
.badge.date{background:var(--sand);border-color:#ecd8b6;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.action{
  min-height:44px;border:0;border-radius:11px;
  background:var(--coral);color:#fff;font-weight:700;cursor:pointer;
}
.action.secondary{background:#e5efec;color:var(--deep)}
.list-item{
  display:grid;grid-template-columns:44px 1fr auto;gap:10px;
  align-items:center;min-height:62px;padding:8px 0;
  width:100%;border:0;border-bottom:1px solid #ece3d5;background:transparent;text-align:left;cursor:pointer;
}
.list-item:last-child{border-bottom:0}
.list-icon{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;font-size:18px;
  background:#fff;border:1px solid var(--border);color:var(--deep)
}
.list-main{min-width:0}
.list-main b{display:block;font-size:13px}
.list-main span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.distance{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}

/* Calendário */
.cal-view{
  position:absolute;
  inset:0;
  z-index:900;
  background:var(--surface);
  display:none;
  overflow-y:auto;
  padding:calc(180px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
}
.cal-view.open{display:block}
.cal-day-group{margin-bottom:18px}
.cal-day-label{
  font-family:Nunito,Arial,sans-serif;
  font-size:14px;
  color:var(--deep);
  font-weight:700;
  margin:0 0 8px 2px;
}
.cal-item{
  width:100%;text-align:left;color:inherit;font:inherit;
  display:flex;
  gap:12px;
  align-items:flex-start;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}
.cal-time{
  min-width:52px;
  max-width:130px;
  flex:0 0 110px;
  line-height:1.5;
  font-weight:700;
  font-size:13px;
  color:var(--coral-dark);
  padding-top:1px;
}
.cal-main{min-width:0;flex:1}
.cal-main b{display:block;font-size:14px;color:var(--text)}
.cal-main span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}

.toast{
  position:absolute;z-index:1500;left:50%;
  top:calc(178px + var(--safe-top));
  transform:translateX(-50%) translateY(-6px);
  background:rgba(14,59,77,.94);color:#fff;
  padding:8px 12px;border-radius:999px;font-size:12px;
  opacity:0;transition:.2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Marcador */
.poi-marker{
  width:34px;height:34px;border-radius:50% 50% 50% 4px;
  background:var(--category-color,var(--deep));border:3px solid var(--surface);
  box-shadow:0 3px 10px rgba(8,37,48,.35);
  display:grid;place-items:center;
  font-size:15px;color:#fff;
  transform:rotate(-45deg);
}
.poi-marker span{transform:rotate(45deg)}
.marker-cluster div{font-family:Nunito,Arial,sans-serif;font-weight:800;background:var(--deep);color:#fff;border:3px solid var(--surface);box-shadow:0 3px 12px rgba(8,37,48,.28)}

@media(max-width:600px){
  .topbar{right:8px;gap:6px}.brand{padding:8px 10px}.brand strong{font-size:14px}.brand span{font-size:9px}.brand .last-update{display:none}
  .view-switch{flex:0 0 auto}.view-btn{width:46px;min-height:40px;padding:0 3px}
}

.popup-photo{width:100%;border-radius:10px;margin-bottom:8px;display:block;max-height:130px;object-fit:cover}
.leaflet-popup-content-wrapper{border-radius:14px;font-family:Nunito,Arial,sans-serif}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <strong>Qual a Boa Floripa</strong>
    <span id="brandSubtitle">Carregando eventos…</span>
    <span class="last-update">Última atualização: 16/09/2026 às 21:28</span>
  </div>
  <div class="view-switch">
    <button class="view-btn active" id="btnViewMap" type="button">Mapa</button>
    <button class="view-btn" id="btnViewCal" type="button">Agenda</button>
  </div>
</div>

<div class="search-box">
  <div class="search-inner">
    <span>⌕</span>
    <input id="search" type="text" placeholder="Buscar evento ou lugar…" autocomplete="off">
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="categories" id="categories"></div>
<button class="fab filter-toggle" id="filterToggle" type="button" aria-label="Filtrar por data e hora" title="Filtrar por data e hora" aria-haspopup="dialog">◷</button>
<dialog class="filter-dialog" id="filterDialog" aria-labelledby="filterTitle">
  <form id="filterForm">
    <h2 id="filterTitle">Quando vamos?</h2>
    <div class="filter-grid">
      <label>Data inicial<input type="date" id="filterDateFrom"></label>
      <label>Data final<input type="date" id="filterDateTo"></label>
    </div>
    <div class="filter-presets" id="filterPresets">
      <button class="filter-preset" data-preset="today" type="button">Hoje</button>
      <button class="filter-preset" data-preset="tomorrow" type="button">Amanhã</button>
      <button class="filter-preset" data-preset="weekend" type="button">Fim de semana</button>
      <button class="filter-preset" data-preset="7days" type="button">Próximos 7 dias</button>
    </div>
    <details class="advanced-filters">
      <summary>Mais opções</summary>
      <div class="filter-grid">
        <label>A partir de<input type="time" id="filterTimeFrom"></label>
        <label>Até<input type="time" id="filterTimeTo"></label>
      </div>
      <label class="filter-check"><input type="checkbox" id="filterUnknown" checked>Incluir eventos sem horário informado</label>
      <p>A faixa de horários vale para cada dia. Campos vazios não restringem a busca.</p>
    </details>
    <p id="filterError" class="filter-error" role="alert"></p>
    <div class="filter-buttons">
      <button class="action secondary" id="filterClear" type="button">Limpar filtros</button>
      <button class="action secondary" id="filterCancel" type="button">Cancelar</button>
      <button class="action" type="submit">Aplicar</button>
    </div>
  </form>
</dialog>

<div class="quick-actions">
  <label class="basemap-picker" for="basemapSelect">
    <span>Tipo de mapa</span>
    <select id="basemapSelect" aria-label="Tipo de mapa"></select>
  </label>
  <button class="fab" id="locateBtn" title="Minha localização">◎</button>
  <button class="fab" id="fitBtn" title="Ver toda Floripa">⤢</button>
</div>

<div id="map"></div>

<section class="sheet collapsed" id="sheet">
  <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="false" aria-controls="sheetBody">
    <div class="sheet-head">
      <div>
        <strong id="sheetTitle">Ver eventos em Floripa</strong>
        <span id="sheetSubtitle"></span>
      </div>
      <span>⌃</span>
    </div>
  </button>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Fechar detalhes do evento" title="Fechar detalhes">×</button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="cal-view" id="calView"></div>

<div class="toast" id="toast"></div>

  "Claro — Esri":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16,attribution:'Tiles &copy; Esri — Sources: Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community'}),
  "Escuro — Esri":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16,className:'basemap-dark',attribution:'Tiles &copy; Esri — Sources: Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS user community'})
};
// Local HTML has no HTTP referrer: start with satellite in downloaded files.
const basemapSelect=document.getElementById('basemapSelect');
for(const name of Object.keys(baseMaps))basemapSelect.add(new Option(name,name));
basemapSelect.value=location.protocol==='file:'?'Claro — Esri':'Ruas — OpenStreetMap';
let activeBase=baseMaps[basemapSelect.value];
activeBase.addTo(map);
basemapSelect.addEventListener('change',()=>{
  map.removeLayer(activeBase);
  activeBase=baseMaps[basemapSelect.value];
  activeBase.addTo(map);
});
for(const [name,layer] of Object.entries(baseMaps)){
  let warned=false;
  layer.on('tileerror',()=>{
    if(map.hasLayer(layer)&&!warned){
      warned=true;
      if(layer===baseMaps['Ruas — OpenStreetMap']){
        basemapSelect.value='Claro — Esri';
        basemapSelect.dispatchEvent(new Event('change'));
        showToast('OpenStreetMap indisponível. Exibindo o mapa claro da Esri.',7000);
      }else showToast('Mapa base indisponível. Escolha outra opção no seletor.',7000);
    }
  });
  layer.on('add',()=>{warned=false;});
}
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
const attributionBox=map.attributionControl.getContainer();
new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--attribution-height',`${Math.ceil(attributionBox.getBoundingClientRect().height)}px`);
}).observe(attributionBox);

let activeFilter="todos";
let temporalFilter={dateFrom:'',dateTo:'',timeFrom:'',timeTo:'',includeUnknown:true};

function matchesFilters(ev){
  if(activeFilter!=='todos'&&ev.categoria!==activeFilter)return false;
  const f=temporalFilter;
  if(f.dateFrom&&(ev.data_fim||ev.data_inicio)<f.dateFrom)return false;
  if(f.dateTo&&ev.data_inicio>f.dateTo)return false;
  if(!f.timeFrom&&!f.timeTo)return true;
  const start=ev.hora_inicio,end=ev.hora_fim;
  if(!start&&!end)return f.includeUnknown;
  // A sole known time is a point, never an invented duration.
  const lo=f.timeFrom||'00:00',hi=f.timeTo||'23:59';
  if(!start||!end){const known=start||end;return known>=lo&&known<=hi;}
  // An explicitly overnight interval intersects late evening or early morning.
  if(end<start)return start<=hi||end>=lo;
  return start<=hi&&end>=lo;
}

function filteredEvents(){return eventos.filter(matchesFilters);}
let userLatLng=null;
let userMarker=null;

function markerIcon(ev){
  const icone=categoriasInfo[ev.categoria]?.icone||"•";
  return L.divIcon({
    className:"",
    html:`<div class="poi-marker" style="--category-color:${categoriasInfo[ev.categoria]?.cor||'#075c68'}"><span>${icone}</span></div>`,
    iconSize:[34,42],iconAnchor:[17,41],popupAnchor:[0,-38]
  });
}

function formatHorario(ev){
  const inicio=/^([01]\d|2[0-3]):[0-5]\d$/.test(ev.hora_inicio||'')?ev.hora_inicio:null;
  const fim=/^([01]\d|2[0-3]):[0-5]\d$/.test(ev.hora_fim||'')?ev.hora_fim:null;
  if(inicio&&fim&&inicio!==fim)return `${inicio}–${fim}`;
  if(inicio)return inicio;
  if(fim)return `Término às ${fim}. Verifique o início no post`;
  return 'Verifique os horários no post';
}

function formatDataHora(ev){
  const dataFmt=ev.data_inicio.split('-').reverse().join('/');
  const fim=ev.data_fim.split('-').reverse().join('/');
  const intervalo=ev.data_inicio!==ev.data_fim?`${dataFmt} a ${fim}`:dataFmt;
  return `${intervalo} • ${formatHorario(ev)}`;
}

const markers={};
const markerCluster=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,disableClusteringAtZoom:17,maxClusterRadius:27});
map.addLayer(markerCluster);
function renderMarkers(){
  markerCluster.clearLayers();
  Object.keys(markers).forEach(key=>delete markers[key]);
  filteredEvents().forEach(ev=>{
    const m=L.marker([ev.lat,ev.lng],{icon:markerIcon(ev),title:ev.nome});
    m.eventData=ev;
    m.on("click",()=>selectEvent(ev,m));
    markerCluster.addLayer(m);
    markers[ev.id]=m;
  });
}
renderMarkers();

markerCluster.on('clusterclick',event=>{
  const grouped=event.layer.getAllChildMarkers().map(marker=>marker.eventData).filter(Boolean);
  document.getElementById('sheetTitle').textContent=`${grouped.length} eventos nesta área`;
  document.getElementById('sheetSubtitle').textContent='Toque em um evento para ver os detalhes';
  document.getElementById('sheetBody').innerHTML=eventRows(grouped);
  bindEventRows();expandSheet();
});

function categoryChips(){
  const cont=document.getElementById("categories");
  const cats=["todos",...Object.keys(categoriasInfo)];
  cont.innerHTML=cats.map(c=>{
    const label=c==="todos"?"Todos":categoriasInfo[c].nome;
    return `<button class="chip${c==="todos"?" active":""}" style="--category-color:${categoriasInfo[c]?.cor||'#075c68'}" data-filter="${c}" type="button">${label}</button>`;
  }).join("");
  cont.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click",()=>{
      activeFilter=btn.dataset.filter;
      cont.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===btn));
      refreshFilters();
    });
  });
}
categoryChips();

function distanceText(lat,lng){
  if(!userLatLng)return "";
  const m=userLatLng.distanceTo(L.latLng(lat,lng));
  return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1)} km`;
}

function selectEvent(ev,marker){
  document.getElementById("sheetTitle").textContent=ev.nome;
  document.getElementById("sheetSubtitle").textContent=formatDataHora(ev);
  document.getElementById("sheetBody").innerHTML=`
    <div class="event-card">
      ${ev.foto?`<img class="popup-photo" src="${ev.foto}" alt="Foto da publicação de ${ev.nome}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}
      <h3>${categoriasInfo[ev.categoria].icone} ${ev.nome}</h3>
      <p>${ev.descricao}</p>
      <div class="meta">
        <span class="badge date">${formatDataHora(ev)}</span>
        <span class="badge">${ev.local}</span>
        ${ev.bairro?`<span class="badge">Bairro: ${ev.bairro}</span>`:""}
        ${distanceText(ev.lat,ev.lng)?`<span class="badge">${distanceText(ev.lat,ev.lng)}</span>`:""}
      </div>
      ${ev.endereco?`<p style="margin-top:9px"><b>Endereço:</b> ${ev.endereco}</p>`:""}
      <div class="actions">
        <button class="action secondary" id="openInsta" type="button">Ver no Instagram</button>
        <button class="action" id="openRoute" type="button">Como chegar</button>
      </div>
    </div>`;
  document.getElementById("openInsta").addEventListener("click",()=>window.open(ev.instagram_url,"_blank"));
  document.getElementById("openRoute").addEventListener("click",()=>{
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${ev.lat},${ev.lng}`,"_blank");
  });
  expandSheet();
  if(window.innerWidth<850)collapseSheetOnSelect();
}
function collapseSheetOnSelect(){ /* mantém aberto ao selecionar por toque no mapa */ }

function eventRows(feats){return feats.map(ev=>`
    <button class="list-item" data-id="${ev.id}" type="button">
      <div class="list-icon">${categoriasInfo[ev.categoria].icone}</div>
      <div class="list-main">
        <b>${ev.nome}</b>
        <span>${ev.local}${ev.bairro?` · ${ev.bairro}`:""} • ${formatDataHora(ev)}</span>
      </div>
      <div class="distance">${distanceText(ev.lat,ev.lng)}</div>
    </button>`).join("") || '<p>Nenhum evento corresponde aos filtros.</p>'}

function bindEventRows(){
  document.querySelectorAll(".list-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const ev=eventos.find(e=>e.id===Number(el.dataset.id));
      const marker=markers[ev.id];
      if(ev&&marker){map.setView(marker.getLatLng(),17);selectEvent(ev,marker);}
    });
  });
}

function renderList(){
  const feats=filteredEvents();
  document.getElementById("sheetTitle").textContent=activeFilter==="todos"?"Ver eventos em Floripa":categoriasInfo[activeFilter].nome;
  document.getElementById("sheetSubtitle").textContent=`${feats.length} ${feats.length===1?"evento":"eventos"}`;
  document.getElementById("brandSubtitle").textContent=`${feats.length} de ${eventos.length} eventos`;
  document.getElementById("sheetBody").innerHTML=eventRows(feats);
  bindEventRows();
}
renderList();

/* =========================================================
   CALENDÁRIO / AGENDA
   ========================================================= */
function diaLabel(dataStr){
  const dias=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
  const d=new Date(dataStr+"T00:00:00");
  const [,m,day]=dataStr.split("-");
  return `${dias[d.getDay()]} • ${day}/${m}`;
}

function renderCalendar(){
  const feats=filteredEvents()
    .slice().sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio)||(a.hora_inicio||'99:99').localeCompare(b.hora_inicio||'99:99'));
  const grupos={};
  feats.forEach(ev=>{
    (grupos[ev.data_inicio]=grupos[ev.data_inicio]||[]).push(ev);
  });
  const cal=document.getElementById("calView");
  cal.innerHTML=Object.keys(grupos).map(data=>`
    <div class="cal-day-group">
      <div class="cal-day-label">${diaLabel(data)}</div>
      ${grupos[data].map(ev=>`
        <button class="cal-item" data-id="${ev.id}" type="button">
          <div class="cal-time">${formatHorario(ev)}</div>
          <div class="cal-main">
            <b>${categoriasInfo[ev.categoria].icone} ${ev.nome}</b>
            <span>${ev.local} — ${ev.descricao}</span>
          </div>
        </button>`).join("")}
    </div>`).join("") || `<p style="color:var(--muted);text-align:center;margin-top:40px">Nenhum evento nesta categoria.</p>`;
  cal.querySelectorAll(".cal-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const ev=eventos.find(e=>e.id===Number(el.dataset.id));
      switchView("map");
      const marker=markers[ev.id];
      if(marker){
        map.setView(marker.getLatLng(),15);
        selectEvent(ev,marker);
      }
    });
  });
}
renderCalendar();

/* Alternador de vista */
function switchView(view){
  const calOpen=view==="cal";
  document.querySelector('.quick-actions').style.display=calOpen?'none':'flex';
  document.getElementById('map').style.display=calOpen?'none':'block';
  document.getElementById("calView").classList.toggle("open",calOpen);
  document.getElementById("btnViewMap").classList.toggle("active",!calOpen);
  document.getElementById("btnViewCal").classList.toggle("active",calOpen);
  document.getElementById("categories").style.display="flex";
  document.getElementById("sheet").style.display=calOpen?"none":"block";
  if(!calOpen)setTimeout(()=>map.invalidateSize(),50);
}
document.getElementById("btnViewMap").addEventListener("click",()=>switchView("map"));
document.getElementById("btnViewCal").addEventListener("click",()=>switchView("cal"));

/* Busca */
const search=document.getElementById("search");
const results=document.getElementById("searchResults");
search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  results.innerHTML="";
  if(q.length<2){results.classList.remove("open");return;}
  const matches=filteredEvents().filter(e=>(e.nome+e.local+e.descricao).toLowerCase().includes(q)).slice(0,8);
  matches.forEach(ev=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="search-item";
    b.innerHTML=`<b>${categoriasInfo[ev.categoria].icone} ${ev.nome}</b><span>${ev.local} • ${formatDataHora(ev)}</span>`;
    b.addEventListener("click",()=>{
      results.classList.remove("open");
      search.value=ev.nome;
      switchView("map");
      const marker=markers[ev.id];
      map.setView(marker.getLatLng(),15);
      selectEvent(ev,marker);
    });
    results.appendChild(b);
  });
  results.classList.toggle("open",matches.length>0);
});

/* Localização */
const locateBtn=document.getElementById("locateBtn");
locateBtn.addEventListener("click",()=>{
  if(!("geolocation" in navigator)){showToast("Geolocalização não suportada");return;}
  locateBtn.textContent="…";
  map.locate({setView:false,enableHighAccuracy:true,timeout:10000,maxZoom:15});
});
map.on("locationfound",e=>{
  locateBtn.textContent="◎";
  userLatLng=e.latlng;
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.circleMarker(e.latlng,{radius:7,color:"#1976d2",weight:2,fillColor:"#1976d2",fillOpacity:.5}).addTo(map);
  map.setView(e.latlng,14);
  showToast(`Localização encontrada • ±${Math.round(e.accuracy)} m`);
  renderList();
});
map.on("locationerror",()=>{
  locateBtn.textContent="◎";
  showToast("Não foi possível acessar sua localização");
});

/* Enquadrar tudo */
document.getElementById("fitBtn").addEventListener("click",()=>{
  const group=L.featureGroup(Object.values(markers));
  if(group.getLayers().length)map.fitBounds(group.getBounds(),fitPadding);
  showToast("Ilha enquadrada");
});

/* Bottom sheet */
const sheet=document.getElementById("sheet");
function expandSheet(){
  sheet.classList.remove('collapsed');
  document.getElementById('sheetHandle').setAttribute('aria-expanded','true');
}
function collapseSheet(){
  sheet.classList.add('collapsed');
  document.getElementById('sheetHandle').setAttribute('aria-expanded','false');
}
document.getElementById("sheetHandle").addEventListener("click",()=>{
  if(sheet.classList.contains('collapsed'))expandSheet();
  else collapseSheet();
});
document.getElementById('sheetClose').addEventListener('click',()=>{
  collapseSheet();renderList();
  document.getElementById('sheetHandle').focus();
});

/* Shared date, time and category filters for the map and agenda. */
const filterDialog=document.getElementById('filterDialog');
const filterInputs={dateFrom:'filterDateFrom',dateTo:'filterDateTo',timeFrom:'filterTimeFrom',timeTo:'filterTimeTo'};
function refreshFilters(){
  collapseSheet();
  document.getElementById('searchResults').classList.remove('open');
  document.querySelectorAll('.chip').forEach(chip=>{
    const selected=chip.dataset.filter===activeFilter;
    chip.classList.toggle('active',selected);
    chip.setAttribute('aria-pressed',String(selected));
  });
  renderMarkers();renderList();renderCalendar();
  const enabled=Object.keys(filterInputs).some(key=>temporalFilter[key]);
  document.getElementById('filterToggle').classList.toggle('active',enabled);
  document.getElementById('filterToggle').setAttribute('aria-label',enabled?'Filtros de data e hora ativos: editar':'Filtrar por data e hora');
}
document.getElementById('filterToggle').addEventListener('click',()=>{
  for(const [key,id] of Object.entries(filterInputs))document.getElementById(id).value=temporalFilter[key];
  document.getElementById('filterUnknown').checked=temporalFilter.includeUnknown;
  document.getElementById('filterError').textContent='';
  filterDialog.showModal();
});
function localISO(date){
  const year=date.getFullYear(),month=String(date.getMonth()+1).padStart(2,'0'),day=String(date.getDate()).padStart(2,'0');
  return `${year}-${month}-${day}`;
}
function addDays(date,days){const copy=new Date(date);copy.setDate(copy.getDate()+days);return copy;}
document.getElementById('filterPresets').addEventListener('click',event=>{
  const button=event.target.closest('[data-preset]');if(!button)return;
  const today=new Date();let from=today,to=today;
  if(button.dataset.preset==='tomorrow')from=to=addDays(today,1);
  if(button.dataset.preset==='weekend'){
    from=addDays(today,(6-today.getDay()+7)%7);to=addDays(from,1);
  }
  if(button.dataset.preset==='7days')to=addDays(today,6);
  document.getElementById('filterDateFrom').value=localISO(from);
  document.getElementById('filterDateTo').value=localISO(to);
  document.querySelectorAll('.filter-preset').forEach(item=>item.classList.toggle('active',item===button));
  temporalFilter={...temporalFilter,dateFrom:localISO(from),dateTo:localISO(to)};
  refreshFilters();filterDialog.close();
});
['filterDateFrom','filterDateTo'].forEach(id=>document.getElementById(id).addEventListener('change',()=>document.querySelectorAll('.filter-preset').forEach(item=>item.classList.remove('active'))));
document.getElementById('filterCancel').addEventListener('click',()=>filterDialog.close());
document.getElementById('filterClear').addEventListener('click',()=>{
  temporalFilter={dateFrom:'',dateTo:'',timeFrom:'',timeTo:'',includeUnknown:true};
  activeFilter='todos';refreshFilters();filterDialog.close();
});
document.getElementById('filterForm').addEventListener('submit',event=>{
  event.preventDefault();
  const next=Object.fromEntries(Object.entries(filterInputs).map(([key,id])=>[key,document.getElementById(id).value]));
  if(next.dateFrom&&next.dateTo&&next.dateFrom>next.dateTo){
    document.getElementById('filterError').textContent='A data final deve ser igual ou posterior à inicial.';return;
  }
  if(next.timeFrom&&next.timeTo&&next.timeFrom>next.timeTo){
    document.getElementById('filterError').textContent='O horário final do filtro deve ser igual ou posterior ao inicial.';return;
  }
  temporalFilter={...next,includeUnknown:document.getElementById('filterUnknown').checked};
  refreshFilters();filterDialog.close();
});

/* Toast */
let toastTimer;
function showToast(text,duration=1800){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),duration);
}

/* Inicial */
const groupInit=L.featureGroup(Object.values(markers));
if(groupInit.getLayers().length)map.fitBounds(groupInit.getBounds(),fitPadding);
window.addEventListener("resize",()=>map.invalidateSize());
</script>
