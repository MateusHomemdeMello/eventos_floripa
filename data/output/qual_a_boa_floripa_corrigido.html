const prettyDate=date=>date?new Date(date+'T12:00:00Z').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:'UTC'}).replace('.',''):'Data a confirmar';
const times=e=>e.hora_inicio?e.hora_inicio+(e.hora_fim?' – '+e.hora_fim:''):(e.hora_fim?'Início a confirmar · até '+e.hora_fim:'Horário a confirmar');
function dateLabel(e){if(!e.data_inicio)return 'Data a confirmar';if(e.data_inicio!==e.data_fim)return `${prettyDate(e.data_inicio)} até ${prettyDate(e.data_fim)}`;return e.data_inicio===today()?'Hoje':e.data_inicio===addDays(today(),1)?'Amanhã':prettyDate(e.data_inicio);}
let activeQuick='todos',activeCategory='todos',favoritesOnly=false,userLatLng=null;
let currentCarouselEvents=[],currentCarouselIndex=0,filtered=[],places=[],map=null,cluster=null,userMarker=null;
let favorites=new Set();
try{const saved=JSON.parse(localStorage.getItem('qbf-favorites-v1')||'[]');if(Array.isArray(saved))favorites=new Set(saved.map(String));}catch{}
function quickRange(){const day=today();if(activeQuick==='amanha')return [addDays(day,1),addDays(day,1)];if(activeQuick==='fim'){const weekday=new Date(day+'T12:00:00Z').getUTCDay();const saturday=addDays(day,weekday===0?-1:6-weekday);return [saturday,addDays(saturday,1)];}return activeQuick==='todos'?['','']:[day,day];}
// One intersection of period, category, favorites and search feeds all views.
function getFilteredEvents(){
 const [from,to]=quickRange(),q=normalize($('search').value),now=today();
 return eventos.filter(e=>{
  if(e.data_fim&&e.data_fim<now)return false;
  if(from&&(!e.data_inicio||e.data_inicio>to||e.data_fim<from))return false;
  if(activeQuick==='noite'){
   // Unknown hours are not assumed to be evening events; overnight intervals overlap.
   if(!e.hora_inicio)return false;
   const overnight=e.hora_fim&&e.hora_fim<e.hora_inicio;
   if(e.hora_inicio<'18:00'&&(!e.hora_fim||e.hora_fim<='18:00')&&!overnight)return false;
  }
  if(activeCategory!=='todos'&&e.categoria!==activeCategory)return false;
  if(favoritesOnly&&!favorites.has(e.id))return false;
  return !q||normalize([e.nome,e.local,e.endereco,e.bairro,e.descricao,category(e.categoria).nome].join(' ')).includes(q);
 }).sort((a,b)=>(a.data_inicio||'9999').localeCompare(b.data_inicio||'9999')||(a.hora_inicio||'99:99').localeCompare(b.hora_inicio||'99:99')||a.nome.localeCompare(b.nome));
}
const hasCoordinates=e=>e.lat!==null&&e.lng!==null;
// Group venues AFTER filtering. Spatial clustering is a separate operation.
function placeKey(e){const norm=v=>normalize(v).replace(/[^a-z0-9]/g,'');if(e.endereco)return 'address:'+norm(e.endereco);const coords=hasCoordinates(e)?`${e.lat.toFixed(5)},${e.lng.toFixed(5)}`:'';if(coords&&e.local!=='Local a confirmar')return 'place:'+norm(e.local)+':'+coords;return coords?'coords:'+coords:'unknown:'+e.id;}
function groupByPlace(events){const groups=new Map();for(const e of events){const key=placeKey(e);if(!groups.has(key))groups.set(key,{key,nome:e.local,endereco:e.endereco,bairro:e.bairro,lat:e.lat,lng:e.lng,events:[]});const p=groups.get(key);p.events.push(e);if(!hasCoordinates(p)&&hasCoordinates(e)){p.lat=e.lat;p.lng=e.lng;}}return [...groups.values()];}
function placeIcon(place){const same=new Set(place.events.map(e=>e.categoria)).size===1,c=same?category(place.events[0].categoria):{icone:'✦',cor:'#075c68'};return L.divIcon({className:'map-pin',html:`<div class="pin" style="--pin-color:${c.cor}">${c.icone}${place.events.length>1?`<b>${place.events.length}</b>`:''}</div>`,iconSize:[40,40],iconAnchor:[20,35]});}
function clusterEventCount(markers){return markers.reduce((sum,m)=>sum+(Number(m.options.eventCount)||1),0);}
function loadBasemap(){
 const status=$('basemapStatus');
 if(location.protocol==='file:'){
  $('localMapHint').hidden=false;
  status.hidden=false;
  return;
 }
 const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
 });
 tiles.on('tileload',()=>{status.hidden=true;});
 tiles.on('tileerror',event=>{event.tile.style.visibility='hidden';status.hidden=false;});
 tiles.addTo(map);
}
function initMap(){
 if(!window.L){notify('O mapa precisa de internet. Você ainda pode consultar a agenda.');return;}
 map=L.map('map',{zoomControl:false,minZoom:1,maxZoom:19}).setView([-27.5949,-48.5482],12);
 loadBasemap();
 L.control.zoom({position:'topleft'}).addTo(map);
 // Markers represent places: sum their event weights instead of counting markers.
 cluster=L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:55,showCoverageOnHover:false,iconCreateFunction:layer=>L.divIcon({html:`<span>${clusterEventCount(layer.getAllChildMarkers())}</span>`,className:'cluster-icon',iconSize:L.point(46,46)})}):L.layerGroup();
 cluster.addTo(map);
}
function renderMarkers(){if(!cluster)return;cluster.clearLayers();const markers=places.filter(hasCoordinates).map(p=>L.marker([p.lat,p.lng],{icon:placeIcon(p),eventCount:p.events.length,title:`${p.nome}: ${p.events.length} evento(s)`,alt:`${p.nome}: ${p.events.length} evento(s)`}).on('click',()=>openEventGroup(p.events)));if(cluster.addLayers)cluster.addLayers(markers);else markers.forEach(m=>cluster.addLayer(m));}
function fitPlaces(){if(!map)return;const points=places.filter(hasCoordinates).map(p=>[p.lat,p.lng]);if(points.length)map.fitBounds(points,{maxZoom:15,paddingTopLeft:[25,$('top').getBoundingClientRect().bottom+20],paddingBottomRight:[65,35]});}
function distance(e){if(!userLatLng||!hasCoordinates(e))return '';const rad=x=>x*Math.PI/180,[lat,lng]=userLatLng;const a=Math.sin(rad(e.lat-lat)/2)**2+Math.cos(rad(lat))*Math.cos(rad(e.lat))*Math.sin(rad(e.lng-lng)/2)**2;const meters=6371008.8*2*Math.atan2(Math.sqrt(a),Math.sqrt(Math.max(0,1-a)));return meters<1000?`${Math.round(meters/10)*10} m`:`${(meters/1000).toFixed(1)} km`;}
function photo(e,hero=false){const c=category(e.categoria);return `<div class="photo${hero?' hero':''}" style="--photo-color:${c.cor}"><span aria-hidden="true">${c.icone}</span>${e.foto?`<img src="${escapeHTML(e.foto)}" alt="${escapeHTML(e.nome)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div>`;}
function card(e){const saved=favorites.has(e.id);return `<article class="card" data-event="${escapeHTML(e.id)}"><button type="button" class="card-open" data-open="${escapeHTML(e.id)}" aria-label="Ver ${escapeHTML(e.nome)}">${photo(e)}<span class="card-info"><small class="date">${escapeHTML(dateLabel(e))} · ${escapeHTML(times(e))}</small><strong>${escapeHTML(e.nome)}</strong><small>${escapeHTML(e.local)}${e.bairro?' · '+escapeHTML(e.bairro):''}${distance(e)?' · '+distance(e):''}</small></span></button><button type="button" class="heart" data-favorite="${escapeHTML(e.id)}" aria-pressed="${saved}" aria-label="${saved?'Remover dos favoritos':'Quero ir'}: ${escapeHTML(e.nome)}">${saved?'♥':'♡'}</button></article>`;}
const empty=()=>'<div class="empty"><b>Nenhum rolê por aqui…</b>Tente outra busca ou combine menos filtros.</div>';
function renderAgenda(){const now=today(),ongoing=[],groups=new Map();for(const e of filtered){if(e.data_inicio&&e.data_inicio<now&&e.data_fim>=now){ongoing.push(e);continue;}const date=e.data_inicio||'';if(!groups.has(date))groups.set(date,[]);groups.get(date).push(e);}let html=ongoing.length?`<section class="ongoing"><h2 class="agenda-heading">EM CARTAZ AGORA</h2>${ongoing.map(card).join('')}</section>`:'';for(const [date,events] of groups){const label=date?new Date(date+'T12:00:00Z').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short',timeZone:'UTC'}):'Data a confirmar';html+=`<section><h2 class="agenda-heading">${escapeHTML(label.toUpperCase())}</h2>${events.map(card).join('')}</section>`;}$('agendaList').innerHTML=html||empty();}
// Compute once and synchronize the open carousel when favorites/filters change.
function refresh(){const current=currentCarouselEvents[currentCarouselIndex],key=current?placeKey(current):null;filtered=getFilteredEvents();places=groupByPlace(filtered);$('counts').textContent=`${filtered.length} eventos · ${places.length} lugares`;$('random').disabled=!filtered.length;renderMarkers();renderAgenda();if($('detail').open&&key){const group=places.find(p=>p.key===key);if(!group){$('detail').close();}else{currentCarouselEvents=group.events;currentCarouselIndex=Math.max(0,group.events.findIndex(e=>e.id===current.id));updateCarousel();}}}
function openEventGroup(events,selectedId){if(!events.length)return;currentCarouselEvents=events;currentCarouselIndex=Math.max(0,events.findIndex(e=>e.id===String(selectedId)));updateCarousel();if(!$('detail').open)$('detail').showModal();$('closeDetail').focus();}
function openEvent(id){const group=places.find(p=>p.events.some(e=>e.id===String(id)));if(group)openEventGroup(group.events,id);}
function updateCarousel(){const e=currentCarouselEvents[currentCarouselIndex];if(!e)return;const c=category(e.categoria),saved=favorites.has(e.id),count=currentCarouselEvents.length;const navigation=count>1?`<div class="carousel-nav"><button type="button" data-move="-1" aria-label="Evento anterior">‹</button><div class="dots">${currentCarouselEvents.map((_,i)=>`<button type="button" class="dot" data-slide="${i}" aria-label="Ir para evento ${i+1}" aria-pressed="${i===currentCarouselIndex}">●</button>`).join('')}</div><button type="button" data-move="1" aria-label="Próximo evento">›</button></div>`:'';
 $('detailContent').innerHTML=`${photo(e,true)}<div class="detail-body"><div class="eyebrow" id="carouselCount" aria-live="polite">${count>1?`${currentCarouselIndex+1} de ${count} neste local · `:''}${c.icone} ${c.nome}</div><h2 id="detailTitle">${escapeHTML(e.nome)}</h2><div class="detail-meta"><p>◷ <b>${escapeHTML(dateLabel(e))}</b><br>${escapeHTML(times(e))}</p><p>⌖ <b>${escapeHTML(e.local)}</b><br>${escapeHTML(e.endereco)}${e.bairro?'<br>'+escapeHTML(e.bairro):''}${distance(e)?'<br>'+distance(e)+' de você':''}</p></div>${e.descricao?`<p class="description">${escapeHTML(e.descricao)}</p>`:''}<div class="actions"><button type="button" class="save" data-favorite="${escapeHTML(e.id)}" aria-pressed="${saved}">${saved?'♥ Salvo':'♡ Quero ir'}</button>${hasCoordinates(e)?`<a href="https://www.google.com/maps/dir/?api=1&amp;destination=${e.lat},${e.lng}" target="_blank" rel="noopener noreferrer">🧭 Como chegar</a>`:''}<button type="button" id="share">↗ Compartilhar evento</button></div>${e.instagram_urls.length?`<div class="source-links" aria-label="Publicações originais">${e.instagram_urls.map((url,i)=>`<a class="original" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${e.instagram_urls.length===1?'Ver publicação original':'Publicação '+(i+1)}</a>`).join('')}</div>`:''}<div id="detailNotice" role="status"></div>${navigation}</div>`;
}
function moveCarousel(delta){const size=currentCarouselEvents.length;if(size<2)return;currentCarouselIndex=(currentCarouselIndex+delta+size)%size;updateCarousel();}
function toggleFavorite(id){id=String(id);favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('qbf-favorites-v1',JSON.stringify([...favorites]));}catch{notify('Salvo nesta sessão. O navegador bloqueou o armazenamento permanente.');}refresh();}
let noticeTimer;function notify(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,4500);}
async function shareEvent(){const e=currentCarouselEvents[currentCarouselIndex];if(!e)return;const text=`${e.nome}\n${dateLabel(e)} · ${times(e)}\n${e.local}${e.instagram_urls.length?'\n'+e.instagram_urls.join('\n'):''}`;if(navigator.share){try{await navigator.share({title:e.nome,text});return;}catch(error){if(error.name==='AbortError')return;}}try{await navigator.clipboard.writeText(text);$('detailNotice').textContent='Informações copiadas!';}catch{const field=document.createElement('textarea');field.value=text;field.setAttribute('aria-label','Texto para compartilhar');field.readOnly=true;$('detailNotice').replaceChildren('Copie o texto abaixo:',field);field.focus();field.select();}}
function switchView(view){const agenda=view==='agenda';$('agenda').hidden=!agenda;$('mapActions').hidden=agenda;$('mapTab').setAttribute('aria-pressed',String(!agenda));$('agendaTab').setAttribute('aria-pressed',String(agenda));if(!agenda&&map)requestAnimationFrame(()=>map.invalidateSize());}
$('categories').innerHTML='<button type="button" class="chip category-chip" data-category="todos" aria-pressed="true" style="--cat:#075c68">Todos</button>'+Object.entries(categories).map(([key,c])=>`<button type="button" class="chip category-chip" data-category="${key}" aria-pressed="false" style="--cat:${c.cor}"><span>${c.icone}</span> ${c.nome}</button>`).join('');
$('quickFilters').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.id==='favoriteFilter'){favoritesOnly=!favoritesOnly;button.setAttribute('aria-pressed',String(favoritesOnly));button.textContent=favoritesOnly?'♥ Quero ir':'♡ Quero ir';}else{activeQuick=button.dataset.quick;document.querySelectorAll('[data-quick]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.quick===activeQuick)));}refresh();});
$('categories').addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));refresh();});
let searchTimer;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,120);});
document.addEventListener('click',event=>{const favorite=event.target.closest('[data-favorite]'),open=event.target.closest('[data-open]'),move=event.target.closest('[data-move]'),slide=event.target.closest('[data-slide]');if(favorite)toggleFavorite(favorite.dataset.favorite);else if(open)openEvent(open.dataset.open);else if(move)moveCarousel(Number(move.dataset.move));else if(slide){currentCarouselIndex=Number(slide.dataset.slide);updateCarousel();}else if(event.target.closest('#share'))shareEvent();});
// The colored fallback is already behind each photo; failed URLs are removed.
document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement){event.target.style.opacity='1';const icon=event.target.parentElement.querySelector('span');if(icon)icon.style.visibility='hidden';}},true);
document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)event.target.remove();},true);
$('mapTab').onclick=()=>switchView('map');$('agendaTab').onclick=()=>switchView('agenda');$('closeDetail').onclick=()=>$('detail').close();
$('detail').addEventListener('click',event=>{if(event.target===$('detail')){const r=$('detail').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('detail').close();}});
document.addEventListener('keydown',event=>{if(!$('detail').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();moveCarousel(event.key==='ArrowLeft'?-1:1);}if(event.key==='Escape')$('detail').close();});
// Vertical movement cancels a swipe; normal detail scrolling stays native.
let swipeStart=null;$('detail').addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'||event.target.closest('button,a,input,textarea'))return;swipeStart={x:event.clientX,y:event.clientY};});
$('detail').addEventListener('pointercancel',()=>swipeStart=null);
$('detail').addEventListener('pointerup',event=>{if(!swipeStart)return;const dx=event.clientX-swipeStart.x,dy=event.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)moveCarousel(dx<0?1:-1);});
$('random').onclick=()=>{if(!filtered.length)return;const e=filtered[Math.floor(Math.random()*filtered.length)];openEvent(e.id);};
$('fit').onclick=fitPlaces;
$('locate').onclick=()=>{if(!navigator.geolocation){notify('Localização indisponível neste navegador.');return;}navigator.geolocation.getCurrentPosition(position=>{userLatLng=[position.coords.latitude,position.coords.longitude];if(map){if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(userLatLng,{radius:8,color:'#fff',weight:3,fillColor:'#087780',fillOpacity:1}).addTo(map).bindTooltip('Você está aqui');map.setView(userLatLng,14);}refresh();notify('Localização encontrada. As distâncias estão nos eventos.');},()=>notify('Não foi possível obter sua localização. Continue explorando o mapa e a agenda.'),{timeout:12000,maximumAge:60000});};
new ResizeObserver(()=>document.documentElement.style.setProperty('--top-height',$('top').offsetHeight+'px')).observe($('top'));
initMap();refresh();if(map)requestAnimationFrame(fitPlaces);
</script>
</body>
</html>
